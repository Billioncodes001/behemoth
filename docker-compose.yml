services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-behemoth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Please set POSTGRES_PASSWORD in .env (or run ./setup.sh docker)}
      POSTGRES_DB: ${POSTGRES_DB:-behemoth}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-behemoth} -d ${POSTGRES_DB:-behemoth}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  behemoth:
    image: ${BEHEMOTH_IMAGE:-ruoji6/behemoth}:${BEHEMOTH_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: UTC
      BEHEMOTH_PG_DSN: ${BEHEMOTH_PG_DSN:-}
      BEHEMOTH_PG_HOST: postgres
      BEHEMOTH_PG_PORT: "5432"
      BEHEMOTH_PG_USER: ${POSTGRES_USER:-behemoth}
      BEHEMOTH_PG_PASSWORD: ${POSTGRES_PASSWORD}
      BEHEMOTH_PG_DB: ${POSTGRES_DB:-behemoth}
      BEHEMOTH_PG_SSLMODE: disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BEHEMOTH_LLM_PROVIDER: ${BEHEMOTH_LLM_PROVIDER:-}
      BEHEMOTH_LLM_MODEL: ${BEHEMOTH_LLM_MODEL:-}
      BEHEMOTH_LLM_BASE_URL: ${BEHEMOTH_LLM_BASE_URL:-}
      BEHEMOTH_LLM_PROXY: ${BEHEMOTH_LLM_PROXY:-}
      BEHEMOTH_HTTP_USER_AGENT: ${BEHEMOTH_HTTP_USER_AGENT:-}
      # C2 listener: dedicated implant listener (empty = reuse the main port);
      # TLS cert/key paths optional; BEHEMOTH_C2_PUBLIC_URL is the URL implants call back to.
      BEHEMOTH_C2_ADDR: ${BEHEMOTH_C2_ADDR:-}
      BEHEMOTH_C2_PUBLIC_URL: ${BEHEMOTH_C2_PUBLIC_URL:-}
      BEHEMOTH_C2_SECRET: ${BEHEMOTH_C2_SECRET:-}
      BEHEMOTH_C2_TLS_CERT: ${BEHEMOTH_C2_TLS_CERT:-}
      BEHEMOTH_C2_TLS_KEY: ${BEHEMOTH_C2_TLS_KEY:-}
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
      # Dedicated C2 listener (only meaningful when BEHEMOTH_C2_ADDR is set).
      - "${BEHEMOTH_C2_PORT:-127.0.0.1:8443}:8443"
    volumes:
      # 把数据目录（含 jwt.key、SQLite 等）绑定到项目根目录的 data/，
      # 方便在宿主机直接查看/备份，容器重建也不丢。
      - ./data:/app/data
      # 把项目根目录的 skills 挂进容器（覆盖镜像内置的 /app/skills）；
      # 改 skill 无需重建镜像，容器读的就是宿主机这份。
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
